name: Deploy Incident Triage Lambdas

on:
  workflow_run:
    workflows:
      - Incident Triage - CI Tests
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: incident-triage-lambda-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Lambda Functions

    # Deploy only after successful CI on a push to main.
    # Pull requests, failed runs and manual CI runs cannot deploy.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Download Lambda artifacts from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: dist

      - name: Validate downloaded artifacts
        run: |
          test -s dist/chaos_lambda.zip
          test -s dist/responder_lambda.zip

          echo "Both Lambda deployment artifacts are available."

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Chaos Lambda
        run: |
          aws lambda update-function-code \
            --function-name incident-triage-chaos-lambda \
            --zip-file fileb://dist/chaos_lambda.zip \
            --region "$AWS_DEFAULT_REGION"

          aws lambda wait function-updated-v2 \
            --function-name incident-triage-chaos-lambda \
            --region "$AWS_DEFAULT_REGION"

      - name: Deploy Responder Lambda
        run: |
          aws lambda update-function-code \
            --function-name incident-triage-responder-lambda \
            --zip-file fileb://dist/responder_lambda.zip \
            --region "$AWS_DEFAULT_REGION"

          aws lambda wait function-updated-v2 \
            --function-name incident-triage-responder-lambda \
            --region "$AWS_DEFAULT_REGION"

      # Verify both Lambda functions were deployed successfully
      # and have the expected AWS configuration.
      - name: Verify deployed Lambda functions
        shell: bash
        run: |
          FUNCTIONS=(
            "incident-triage-chaos-lambda"
            "incident-triage-responder-lambda"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            echo "Verifying $FUNCTION..."

            CONFIG=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION" \
              --region "$AWS_DEFAULT_REGION")

            STATE=$(echo "$CONFIG" | jq -r '.State')
            RUNTIME=$(echo "$CONFIG" | jq -r '.Runtime')
            HANDLER=$(echo "$CONFIG" | jq -r '.Handler')
            LAST_UPDATE_STATUS=$(echo "$CONFIG" | jq -r '.LastUpdateStatus')

            echo "State: $STATE"
            echo "Runtime: $RUNTIME"
            echo "Handler: $HANDLER"
            echo "Last update: $LAST_UPDATE_STATUS"

            test "$STATE" = "Active"
            test "$RUNTIME" = "python3.13"
            test "$HANDLER" = "lambda_function.lambda_handler"
            test "$LAST_UPDATE_STATUS" = "Successful"

            CODE_HASH=$(aws lambda get-function \
              --function-name "$FUNCTION" \
              --region "$AWS_DEFAULT_REGION" \
              --query 'Configuration.CodeSha256' \
              --output text)

            test -n "$CODE_HASH"
            echo "Code SHA-256: $CODE_HASH"

            echo "$FUNCTION verification successful."
          done

      - name: Deployment completed
        run: |
          echo "Both Lambda functions deployed and verified successfully."
