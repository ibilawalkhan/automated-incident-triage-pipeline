name: Incident Triage - CI Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/chaos_lambda/**"
      - "src/responder_lambda/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Python Lambdas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest -v tests/
